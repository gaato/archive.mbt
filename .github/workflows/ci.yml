name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gates:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container:
      # Keep this aligned with the locally verified compiler/core APIs.
      image: ghcr.io/gaato/moonbit:0.10.20-65efd5b93
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Reference tools
        run: |
          apt-get update
          apt-get install -y python3 zip unzip 7zip build-essential
      - name: Toolchain versions
        run: moon version --all
      - name: Registry index
        run: moon update
      - name: Gates
        env:
          MOON_CC: cc
        run: moon run scripts/gates.mbtx
